<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Scripta - Professional Screenplay Editor</title>
  <meta name="description" content="A modern, minimal, high-performance web application for professional screenplay writing. Industry-standard formatting, keyboard-first workflow.">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="app" class="h-screen flex flex-col bg-background text-foreground">
    <!-- Header -->
    <header class="h-12 border-b border-border bg-background flex items-center justify-between px-4 gap-2">
      <div class="flex items-center gap-2">
        <h1 class="text-sm font-semibold truncate" id="title-display">Untitled Screenplay</h1>
      </div>

      <div class="flex items-center gap-1 ml-auto">
        <button id="theme-toggle" class="inline-flex items-center justify-center rounded-md text-sm font-medium ring-offset-background transition-colors focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-ring focus-visible:ring-offset-2 disabled:pointer-events-none disabled:opacity-50 hover:bg-accent hover:text-accent-foreground h-8 w-8">
          <svg id="sun-icon" class="hidden h-4 w-4" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="4"></circle>
            <path d="M12 2v6"></path>
            <path d="M12 16v6"></path>
            <path d="M4.22 4.22l4.24 4.24"></path>
            <path d="M15.54 15.54l4.24 4.24"></path>
            <path d="M2 12h6"></path>
            <path d="M16 12h6"></path>
            <path d="M4.22 19.78l4.24-4.24"></path>
            <path d="M15.54 8.46l4.24-4.24"></path>
          </svg>
          <svg id="moon-icon" class="h-4 w-4" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"></path>
          </svg>
        </button>

        <button id="focus-toggle" class="inline-flex items-center justify-center rounded-md text-sm font-medium ring-offset-background transition-colors focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-ring focus-visible:ring-offset-2 disabled:pointer-events-none disabled:opacity-50 hover:bg-accent hover:text-accent-foreground h-8 w-8" title="Focus Mode (Ctrl+Shift+F)">
          <svg class="h-4 w-4" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="m7 7 10 10M17 7 7 17"></path>
          </svg>
        </button>

        <button id="left-panel-toggle" class="inline-flex items-center justify-center rounded-md text-sm font-medium ring-offset-background transition-colors focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-ring focus-visible:ring-offset-2 disabled:pointer-events-none disabled:opacity-50 hover:bg-accent hover:text-accent-foreground h-8 w-8" title="Toggle Scene Panel (Ctrl+[)">
          <svg class="h-4 w-4" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect width="18" height="18" x="3" y="3" rx="2"></rect>
            <path d="M9 3v18"></path>
          </svg>
        </button>

        <button id="right-panel-toggle" class="inline-flex items-center justify-center rounded-md text-sm font-medium ring-offset-background transition-colors focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-ring focus-visible:ring-offset-2 disabled:pointer-events-none disabled:opacity-50 hover:bg-accent hover:text-accent-foreground h-8 w-8" title="Toggle Tools Panel (Ctrl+])">
          <svg class="h-4 w-4" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect width="18" height="18" x="3" y="3" rx="2"></rect>
            <path d="M15 3v18"></path>
          </svg>
        </button>

        <button id="command-palette-toggle" class="inline-flex items-center justify-center rounded-md text-sm font-medium ring-offset-background transition-colors focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-ring focus-visible:ring-offset-2 disabled:pointer-events-none disabled:opacity-50 hover:bg-accent hover:text-accent-foreground h-8 w-8" title="Command Palette (Ctrl+K)">
          <svg class="h-4 w-4" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M4 12a8 8 0 0 1 15.3-5.7"></path>
          </svg>
        </button>
      </div>
    </header>

    <!-- Main content area -->
    <div class="flex flex-1 overflow-hidden">
      <!-- Left Panel -->
      <aside id="left-panel" class="w-64 border-r border-border bg-background overflow-y-auto transition-all duration-200">
        <div class="p-4">
          <h2 class="text-sm font-semibold mb-4">Scenes</h2>
          <div id="scenes-list" class="space-y-2">
            <!-- Scenes will be populated here -->
          </div>
        </div>
      </aside>

      <!-- Editor area -->
      <main class="flex-1 flex flex-col overflow-hidden">
        <!-- Screenplay content -->
        <div id="screenplay-container" class="flex-1 overflow-y-auto p-8 bg-background">
          <div class="max-w-3xl mx-auto">
            <div id="editor-content" class="space-y-0 font-mono text-sm leading-relaxed">
              <!-- Elements will be populated here -->
            </div>
          </div>
        </div>

        <!-- Status bar -->
        <div class="h-8 border-t border-border bg-background px-4 flex items-center justify-between text-xs text-muted-foreground">
          <span id="page-count">Page 1</span>
          <span id="word-count">Words: 0</span>
          <span id="save-status">All changes saved</span>
        </div>
      </main>

      <!-- Right Panel -->
      <aside id="right-panel" class="w-64 border-l border-border bg-background overflow-y-auto transition-all duration-200">
        <div class="p-4">
          <h2 class="text-sm font-semibold mb-4">Character Analytics</h2>
          <div id="characters-list" class="space-y-3">
            <!-- Characters will be populated here -->
          </div>
        </div>
      </aside>
    </div>
  </div>

  <!-- Command Palette Dialog -->
  <div id="command-palette" class="hidden fixed inset-0 z-50 bg-black/50 flex items-start justify-center pt-20">
    <div class="bg-background border border-border rounded-lg shadow-lg w-full max-w-lg">
      <div class="p-4 border-b border-border">
        <input
          id="command-input"
          type="text"
          placeholder="Type a command or search..."
          class="w-full bg-transparent outline-none text-sm"
        >
      </div>
      <div id="command-results" class="max-h-96 overflow-y-auto">
        <!-- Command results will be populated here -->
      </div>
    </div>
  </div>

  <!-- Title Edit Dialog -->
  <div id="title-dialog" class="hidden fixed inset-0 z-50 bg-black/50 flex items-center justify-center">
    <div class="bg-background border border-border rounded-lg shadow-lg p-6 w-96">
      <label class="block text-sm font-medium mb-2">Title</label>
      <input
        id="title-input"
        type="text"
        placeholder="Screenplay Title"
        class="w-full px-3 py-2 border border-border rounded bg-background text-sm mb-4"
      >
      <label class="block text-sm font-medium mb-2">Author</label>
      <input
        id="author-input"
        type="text"
        placeholder="Author Name"
        class="w-full px-3 py-2 border border-border rounded bg-background text-sm mb-4"
      >
      <div class="flex justify-end gap-2">
        <button id="cancel-title" class="px-3 py-2 text-sm rounded hover:bg-accent">Cancel</button>
        <button id="save-title" class="px-3 py-2 text-sm rounded bg-primary text-primary-foreground hover:bg-primary/90">Save</button>
      </div>
    </div>
  </div>

  <!-- Scripts -->
  <script src="lib/screenplay-store.js"></script>
  <script src="lib/pdf-export.js"></script>
  <script src="app.js"></script>
</body>
</html>
